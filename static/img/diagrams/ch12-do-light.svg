t went</text></g><g class="Y2xhc3NpZnk="><g class="shape" ><rect x="657" y="747" width="312" height="71" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="813" y="789.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px">5. Classify: worth another try?</text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="892" y="941" width="528" height="71" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B2 fill-B6" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="1156" y="983.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px">Return the reply, or a failure not worth retrying, as it is</text></g><g class="YmFja29mZg=="><g class="shape" ><rect x="0" y="941" width="407" height="71" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="203.5" y="983.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px">6. Wait: the backoff, or the server&#39;s delay</text></g><g class="ZXhoYXVzdGVk"><g class="shape" ><rect x="467" y="941" width="365" height="71" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B2 fill-B6" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="649.5" y="983.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px">Retries run out: return a *RetryError</text></g><g class="KGFsbG93IC0mZ3Q7IGhvb2spWzBd"><marker id="mk-d2-3386427208-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 377.475745 72.625538 C 725.099976 127.263 812.5 151 812.5 187" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3386427208-3488378134)" mask="url(#d2-3386427208)" /></g><g class="KGhvb2sgLSZnd