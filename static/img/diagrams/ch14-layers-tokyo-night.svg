7" width="478" height="68" stroke="#7AA2F7" fill="#292E42" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="433" y="807.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px">4. What leaves: issue text checked for links and secrets</text></g><g class="bWFya2luZw=="><g class="shape" ><rect x="192" y="958" width="482" height="68" stroke="#7AA2F7" fill="#292E42" class=" stroke-B2 fill-B6" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="433" y="998.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px">5. Marking tool output as data: helps, can&#39;t be relied on</text></g><g class="KG9yZGVyIC0mZ3Q7IGNhcHMpWzBd"><marker id="mk-d2-2492870627-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#7AA2F7" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 433 72.5 C 433 120.099998 433 144.899994 433 190.5" stroke="#7AA2F7" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2492870627-3488378134)" mask="url(#d2-2492870627)" /><text x="433.5" y="139" fill="#A9B1D6" class="text-italic fill-N2" style="text-anchor:middle;font-size:18px">both requests</text></g><g class="KGNhcHMgLSZndDsgcGF0aHMpWzBd"><path d="M 433 263.5 C 433 311.100006 433 335.899994 433 381.5" stroke="#7AA2F7" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2492870627-3488378134)" mask="url(#d2-2492870627)" /><text x="433.5" y="330" fill="#A9B1D6" class="text-italic fill-N2" style="text-anchor:middle;font-size:18px">the edit (closing has nothing to call)</text></g><g class="KHBhdGhzIC0mZ3Q7IGFwcHJvdmFsKVswXQ=="><path d="M 433 454.5 C 433 502.100006 433 526.900024 433 572.5" stroke="#7AA2F7" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2492870627-3488378134)" mask="url(#d2-2492870627)" /><text x="433" y="521" fill="#A9B1D6" class="text-italic fill-N2" style="text-anchor:middle;font-size:18px">the edit, waiting for a decision</text></g><g class="KGFwcHJvdmFsIC0mZ3Q7IGVncmVzcylbMF0="><path d="M 433 645.5 C 433 693.099976 433 717.900024 433 763.5" stroke="#7AA2F7" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2492870627-3488378134)" mask="url(#d2-2492870627)" /><text x="433" y="712" fill="#A9B1D6" class="text-italic fill-N2" style="text-anchor:middle;font-size:18px">only what a person approved, for this one call; issue text is checked before anyone is asked</text></g><g class="KGVncmVzcyAtJmd0OyBtYXJraW5nKVswXQ=="><path d="M 433 836.5 C 433 884.099976 433 908.900024 433 954.5" stroke="#7AA2F7" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2492870627-3488378134)" mask="url(#d2-2492870627)" /><text x="433.5" y="903" fill="#A9B1D6" class="text-italic fill-N2" style="text-anchor:middle;font-size:18px">text without forbidden links or secrets</text></g><mask id="d2-2492870627" maskUnits="userSpaceOnUse" x="-21" y="-21" width="908" height="1068">
