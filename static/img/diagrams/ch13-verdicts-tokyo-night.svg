xt-anchor:middle;font-size:18px">an answer, graded</text></g><g class="ZW5kcy5idWRnZXQ="><g class="shape" ><rect x="215" y="233" width="218" height="68" stroke="#7AA2F7" fill="#24283B" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="324" y="273.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px">out of turns or money</text></g><g class="ZW5kcy5iYWQ="><g class="shape" ><rect x="105" y="361" width="438" height="68" stroke="#7AA2F7" fill="#24283B" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="324" y="401.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px">a cut-off or filtered reply, a refusal, a bad tool call</text></g><g class="ZW5kcy5wcm92aWRlcg=="><g class="shape" ><rect x="94" y="489" width="460" height="86" stroke="#7AA2F7" fill="#24283B" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="324" y="529.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px"><tspan x="324" dy="0">the provider failed: a retried error that persisted,</tspan><tspan x="324" dy="20.5">the provider&#39;s own failure, a 401 or out-of-credit 402</tspan></text></g><g class="ZW5kcy5oYXJuZXNz"><g class="shape" ><rect x="83" y="635" width="482" height="86" stroke="#7AA2F7" fill="#24283B" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="324" y="675.5" fill="#C0CAF5" class="text-bold fill-N1" style="text-anchor:middle;font-size:18px"><tspan x="324" dy="0">the harness failed: a tool that couldn&#39;t run, an outcome</tspan><tspan x="324" dy="20.5">nobody knows, a shutdown, a grader check that broke</tspan></text></g><g class="KGVuZHMuYW5zd2VyIC0mZ3Q7IHBhc3MpWzBd"><marker id="mk-d2-2912392118-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#7AA2F7" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 42