{{define "main" -}}
<div class="section-page">
  <div class="wrap">
    <header class="guide-head">
      {{- with .Page.Art}}
      {{picture . "badge" false}}
      {{- end}}
      <h1>{{.Page.Title}}</h1>
      <p class="lede">{{.Page.Description}}</p>
    </header>
    <div class="prose">
{{.Page.Body}}
    </div>
    {{- if .Places}}
    <footer class="guide-foot">
      {{- template "pathnav" .}}
    </footer>
    {{- end}}
  </div>
</div>
{{- end}}
