{{define "main" -}}
<article class="guide glossary">
  <div class="wrap">
    <header class="guide-head{{if .Page.Art}} has-art{{end}}">
      {{- with .Page.Art}}
      {{picture . "guide" false}}
      {{- end}}
      <div class="head-text">
      <p class="eyebrow">Reference</p>
      <h1>{{.Page.Title}}</h1>
      <p class="lede">{{.Page.Description}}</p>
      <p class="meta">Updated <time datetime="{{.Page.Modified}}">{{date .Page.Modified}}</time></p>
      </div>
    </header>
    <div class="prose">
{{before .Page.Body "<!-- filter -->"}}
      <form class="gl-filter" role="search" hidden>
        <label for="gl-q">Filter terms</label>
        <input id="gl-q" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="Try &ldquo;context&rdquo; or &ldquo;retry&rdquo;">
        <p class="gl-count" id="gl-count" aria-live="polite"></p>
        <p class="gl-none" id="gl-none" hidden>No terms match. <a id="gl-search" href="/search/">Search the whole site</a>.</p>
      </form>
{{after .Page.Body "<!-- filter -->"}}
    </div>
  </div>
</article>
{{- end}}
